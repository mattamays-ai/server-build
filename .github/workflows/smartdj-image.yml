name: Build Smart DJ image

on:
  workflow_dispatch:
  push:
    branches: ["dev"]
    paths:
      # The image installs the fork's complete Python package and dependency set.
      - "music_assistant/**"
      - "requirements_all.txt"
      - "pyproject.toml"
      - "MANIFEST.in"
      - "setup.cfg"
      - "README.md"
      - "docker/smartdj.Dockerfile"
      - "smartdj-addon/config.yaml"
      - ".github/workflows/smartdj-image.yml"

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/mattamays-ai/server
concurrency:
  group: smartdj-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read add-on version
        id: ver
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^version:[[:space:]]*"\{0,1\}\([^"]*\)"\{0,1\}[[:space:]]*$/\1/p' smartdj-addon/config.yaml | head -n1)
          if [ -z "$VERSION" ]; then
            echo "::error::could not parse version from smartdj-addon/config.yaml"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building add-on version: $VERSION"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/smartdj.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
